services:

  resume-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8001:8001"
    volumes:
      - ${RESUME_DIR_HOST}:/resumes:ro
    environment:
      RESUME_DIR: /resumes
      FASTMCP_TRANSPORT: http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8001"
      LOG_LEVEL: INFO
    restart: unless-stopped
