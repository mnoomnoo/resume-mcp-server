[project]
name = "resume-mcp-server"
version = "0.1.0"
description = "MCP server for browsing and searching job application documents"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "python-docx>=1.0.0",
    "pdfplumber>=0.11.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resume-mcp-server = "resume_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
